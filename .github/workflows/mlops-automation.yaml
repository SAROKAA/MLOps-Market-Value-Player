name: MLOps Automation

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install DVC HTTP
        run: pip install dvc-http

      - name: Configure DVC Auth
        run: |
          dvc remote modify dagshub auth basic
          dvc remote modify dagshub user ${{ secrets.DAGSHUB_USER }}
          dvc remote modify dagshub password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull data from DVC
        run: dvc pull

      - name: Run tests
        run: pytest

      - name: Train model
        run: python src/models/train.py
